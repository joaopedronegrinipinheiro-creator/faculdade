
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login e senha</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<style>
		
	</style>
</head>
<body class="bg-gray-100 h-screen flex justify-center items-center">
	<div class="px-5 w-full sm:w-1/2 lg:1/3">		
		<h1 class="text-4xl">
			Acesso ao Sistema
		</h1>
		<h2 class="text-2xl mb-9">Informe seu e-mail e senha</h2>
		<form method="post">			
			<input class="focus:outline-sky-400 bg-white w-full 
			border border-solid rounded-md p-3 mb-4"
			type="email" name="email" placeholder="Seu E-mail"
			required>

			<input 
			 class="focus:outline-sky-400 bg-white w-full border border-solid rounded-md p-3 mb-4"
			 type="password" name="senha" placeholder="Sua Senha"
			 required>

			<button class="
			 bg-linear-to-r from-sky-300 to-violet-400 transition-all
			 duration-300
			 hover:bg-linear-to-l from-sky-400 to-violet-600
			 hover:text-white cursor-pointer w-full p-3 rounded-md"
			 name="logar">
				Acessar
			</button>
		</form>
	</div>
</body>
</html>
